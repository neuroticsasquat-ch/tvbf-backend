name: Daily TV Maze update

# Required configuration (repo Settings → Secrets and variables → Actions):
#   secret  TVBF_ADMIN_TOKEN  — must match the API's ADMIN_TOKEN

on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC daily
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # The season-credit step took the daily from ~3 requests/show to ~5.11,
    # which at 18 req/10s is ~14.5 minutes per day of accumulated backlog — so
    # 60 minutes started failing at about four days behind, and the first run
    # after the 29-hour backfill pass sits squarely in that band. The run is an
    # asyncio task inside the app, so a workflow timeout doesn't stop it: the
    # failure mode was a red job sitting over work that quietly succeeded.
    timeout-minutes: 180
    steps:
      - name: Trigger update
        id: trigger
        run: |
          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            https://api.tvbingefriend.com/admin/update)
          echo "response=$response"
          run_id=$(echo "$response" | jq -r '.run_id')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        env:
          ADMIN_TOKEN: ${{ secrets.TVBF_ADMIN_TOKEN }}

      - name: Wait for completion
        env:
          ADMIN_TOKEN: ${{ secrets.TVBF_ADMIN_TOKEN }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          for i in $(seq 1 360); do  # 360 × 30s = 180 min, matching timeout-minutes
            body=$(curl -fsS \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              "https://api.tvbingefriend.com/admin/ingest/$RUN_ID")
            status=$(echo "$body" | jq -r '.status')
            echo "[$i] status=$status"
            case "$status" in
              succeeded)
                echo "$body" | jq .
                exit 0
                ;;
              failed|cancelled)
                echo "$body" | jq .
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "timed out waiting for run $RUN_ID"
          exit 1
