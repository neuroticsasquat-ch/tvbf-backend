services:
  tvbf-backend:
    build:
      context: .
      target: prod
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      INGEST_CONSECUTIVE_FAILURE_THRESHOLD: "10"
      INGEST_STALE_RUN_MINUTES: "15"
      # Uptime Kuma push URL, the deadman for the TMDB catalog delta scheduled task.
      # Coolify notifies when the task fails; only this catches it never running.
      HEALTHCHECK_CATALOG_URL: "${HEALTHCHECK_CATALOG_URL:-}"
      # The airdate reconciliation's own, never a shared one: a single check fed
      # by both scheduled tasks is kept alive by either of them, so the day one
      # stops running the other goes on covering for it silently.
      HEALTHCHECK_AIRDATE_URL: "${HEALTHCHECK_AIRDATE_URL:-}"
      LOG_LEVEL: "INFO"
      CORS_ALLOWED_ORIGINS: "https://app.tvbingefriend.com"
      COOKIE_DOMAIN: ".tvbingefriend.com"
      COOKIE_SAMESITE: "lax"
      # Points at Bugsink, which speaks the Sentry protocol.
      SENTRY_DSN: "${SENTRY_DSN:-}"
      # The instrumentation contract: OTel's resource attributes, which Sentry's
      # `release` and `environment` are read back from (`tvbf/telemetry.py`), so an
      # error in Bugsink and a trace in SigNoz name the same build. Coolify exposes
      # the deployed commit as SOURCE_COMMIT ("Include SOURCE_COMMIT in build" must
      # be on, or it is the literal "unknown"). `deployment.environment` here is the
      # only place prod names its environment; ENVIRONMENT is a dev-only fallback.
      OTEL_RESOURCE_ATTRIBUTES: "service.name=tvbf-backend,deployment.environment=production,service.version=${SOURCE_COMMIT:-unknown}"
      # Fallback release for a run without the resource attributes above.
      GIT_SHA: "${SOURCE_COMMIT:-unknown}"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3