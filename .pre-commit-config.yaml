minimum_pre_commit_version: "3.5.0"

# Every hook calls a Taskfile target, and the target runs inside the dev container
# (~/projects/tbc-localdev-infra/CONVENTIONS.md). The Taskfile is the only place the
# toolchain is invoked, so the hooks and `task <x>` can't drift apart. The container
# must be up (`task up`) and rebuilt after a dependency change (`task build`).
#
# Hooks check and never fix: run `task format` before committing.
#
# Exception: the test hook runs `task test:unit`, not the whole suite. The
# integration suite needs the test databases and is too slow for every commit; CI
# runs all of it.
repos:
  - repo: local
    hooks:
      - id: lint
        name: ruff check (container)
        entry: task lint
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$

      - id: format
        name: ruff format --check (container)
        entry: task format:check
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$

      - id: typecheck
        name: pyright (container)
        entry: task typecheck
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$

      - id: test
        name: pytest unit (container)
        entry: task test:unit
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$
