version: '3'

# The workspace owns the compose file one level up; the repo owns nothing about
# where it runs. Override any of these on the command line if the layout moves:
#   task COMPOSE="docker compose" test
vars:
  COMPOSE: "docker compose -f ../docker-compose.yml"
  SVC: api
  API_URL: "http://localhost:8000"
  EXEC: "{{.COMPOSE}} exec {{.SVC}}"
  EXEC_T: "{{.COMPOSE}} exec -T {{.SVC}}"

tasks:
  up:
    desc: Start the backend container (requires infra to be up)
    cmds:
      - "{{.COMPOSE}} up -d"

  down:
    desc: Stop the backend container
    cmds:
      - "{{.COMPOSE}} down"

  build:
    desc: Rebuild the backend image
    cmds:
      - "{{.COMPOSE}} build"

  logs:
    desc: Follow backend logs
    cmds:
      - "{{.COMPOSE}} logs -f {{.SVC}}"

  shell:
    desc: Open a bash shell inside the backend container
    cmds:
      - "{{.EXEC}} bash"

  ps:
    desc: Show compose service status
    cmds:
      - "{{.COMPOSE}} ps"

  db:init:
    desc: Create the required schemas in the workspace database (idempotent)
    # The workspace's compose creates the database itself via POSTGRES_DB, so
    # this only has to make the schemas the first migration assumes exist.
    cmds:
      - >
        {{.COMPOSE}} exec -T db psql -U dev -d app
        -c "CREATE SCHEMA IF NOT EXISTS app; CREATE SCHEMA IF NOT EXISTS catalog;"

  db:create-test:
    desc: Create the test database (idempotent)
    cmds:
      - >
        {{.COMPOSE}} exec -T db psql -U dev -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname='app_test'" | grep -q 1
        || {{.COMPOSE}} exec -T db psql -U dev -d postgres -c "CREATE DATABASE app_test"

  migrate:
    desc: Run alembic migrations against the tvbf database
    cmds:
      - "{{.EXEC}} alembic upgrade head"

  makemigration:
    desc: 'Create a new autogenerated migration (task makemigration -- "message")'
    cmds:
      - "{{.EXEC}} alembic revision --autogenerate -m \"{{.CLI_ARGS}}\""

  db:refresh:
    # `catalog` replaces the `tvmaze` mode this target carried until NEU-1051, so
    # `task db:refresh` still means "refresh the catalog, keep my app data" and
    # nobody's muscle memory now drops the wrong schema. It moves far more data
    # than the old mirror did.
    desc: 'Refresh local tvbf with prod catalog schema (preserves local app data)'
    cmds:
      - 'scripts/refresh_db.sh catalog'

  db:refresh:app:
    desc: 'Refresh local tvbf with prod app schema (anonymizes by default; ANONYMIZE=0 to opt out)'
    cmds:
      - 'scripts/refresh_db.sh app'

  db:refresh:both:
    desc: 'Refresh local tvbf with both prod schemas (anonymizes app by default; ANONYMIZE=0 to opt out)'
    cmds:
      - 'scripts/refresh_db.sh both'

  db:set-password:
    desc: 'Reset a local user password (task db:set-password -- email [password], default: localdev)'
    cmds:
      - 'scripts/set_password.sh {{.CLI_ARGS}}'

  test:
    desc: Run the pytest suite inside the container
    cmds:
      - "{{.EXEC}} pytest {{.CLI_ARGS}}"

  test:unit:
    desc: Run only the unit tests (fast, no DB, no network)
    cmds:
      - "{{.EXEC}} pytest tests/unit {{.CLI_ARGS}}"

  test:integration:
    desc: Run only the integration tests (real test DB)
    cmds:
      - "{{.EXEC}} pytest tests/integration {{.CLI_ARGS}}"

  lint:
    desc: Run ruff check
    cmds:
      - "{{.EXEC}} ruff check src tests"

  format:
    desc: Run ruff format
    cmds:
      - "{{.EXEC}} ruff format src tests"

  typecheck:
    desc: Run pyright static type check
    cmds:
      - "{{.EXEC}} pyright src tests"

  coverage:
    desc: 'Run pytest with coverage (HTML report lands in ./htmlcov)'
    cmds:
      - "{{.EXEC}} pytest --cov=src/tvbf --cov-report=term-missing --cov-report=html {{.CLI_ARGS}}"

  ingest:status:
    # The one status route that filters nothing, so it reads a run of any kind.
    # Poll `update:catalog` through it — that delta has no status route of its
    # own — and the retired TV Maze runs, whose rows moved into
    # `catalog.ingest_run` with the table in NEU-1051.
    desc: 'GET /admin/ingest/<id> — status of any run — task ingest:status -- <uuid>'
    cmds:
      - >
        curl -s {{.API_URL}}/admin/ingest/{{.CLI_ARGS}}
        -H "Authorization: Bearer ${ADMIN_TOKEN:-dev-secret-change-me}"

  ingest:catalog:
    desc: 'POST /admin/catalog-ingest — the full TMDB catalog pass, ~8.7h for 229k series (NEU-1034)'
    cmds:
      - >
        curl -s -X POST {{.API_URL}}/admin/catalog-ingest
        -H "Authorization: Bearer ${ADMIN_TOKEN:-dev-secret-change-me}"

  ingest:catalog:status:
    desc: 'GET /admin/catalog-ingest/<id> — task ingest:catalog:status -- <uuid>'
    cmds:
      - >
        curl -s {{.API_URL}}/admin/catalog-ingest/{{.CLI_ARGS}}
        -H "Authorization: Bearer ${ADMIN_TOKEN:-dev-secret-change-me}"

  update:catalog:
    desc: 'POST /admin/catalog-update — one TMDB catalog delta from /tv/changes (NEU-1035)'
    cmds:
      - >
        curl -s -X POST {{.API_URL}}/admin/catalog-update
        -H "Authorization: Bearer ${ADMIN_TOKEN:-dev-secret-change-me}"

  reconcile:airdates:
    # The *manual* trigger. In prod this runs as a second Coolify scheduled
    # task on the same shape as the catalog delta, with its own
    # `HEALTHCHECK_AIRDATE_URL` deadman — never a shared one. Exit 0 = the pass
    # ran and succeeded; there is no status route of its own, so poll the run
    # through `task ingest:status -- <uuid>`.
    desc: Establish per-season airdate offsets against the TV Maze oracle (idempotent; NEU-1145)
    cmds:
      - {{.EXEC}} python -m tvbf.jobs.airdate_reconcile

  snapshot:trending:
    # The *manual* trigger. In prod this runs as a fourth Coolify scheduled task
    # on the same shape as the catalog delta, with its own
    # `HEALTHCHECK_TRENDING_URL` deadman — never a shared one. Exit 0 = the
    # snapshot ran and succeeded; there is no status route of its own, so poll
    # the run through `task ingest:status -- <uuid>`.
    desc: 'Capture one /trending/tv/week snapshot into catalog.trending_show (NEU-1055)'
    cmds:
      - {{.EXEC}} python -m tvbf.jobs.trending_snapshot

  enrich:tmdb-ids:
    desc: Attach tmdb_id to the copied catalog rows in three tiers (idempotent; NEU-1043)
    cmds:
      # `{{.CLI_ARGS}}` carries --limit N for a smoke run before the full ~90m pass.
      - {{.EXEC}} python -m tvbf.jobs.tmdb_enrichment {{.CLI_ARGS}}

  queue:list:
    desc: 'Report every user-touched show awaiting a human verdict, as JSON (NEU-1044)'
    # `silent` + `-T` for the same reasons `reconcile:capture` needs them: the
    # report is the process stdout, so go-task's banner and docker's TTY
    # carriage returns would both corrupt it. Pass `-- --no-candidates` to skip
    # the TMDB lookups (and the credential) when only the count is wanted.
    silent: true
    cmds:
      - {{.EXEC_T}} python -m tvbf.jobs.human_queue list {{.CLI_ARGS}}

  queue:confirm:
    desc: 'Record a human verdict: this show IS a TMDB series (task queue:confirm -- <show_id> <tmdb_id>)'
    cmds:
      - {{.EXEC}} python -m tvbf.jobs.human_queue confirm {{.CLI_ARGS}}

  queue:reject:
    desc: 'Record a human verdict: TMDB has no counterpart (task queue:reject -- <show_id>)'
    cmds:
      - {{.EXEC}} python -m tvbf.jobs.human_queue reject {{.CLI_ARGS}}

  map:episodes:
    desc: Attach tmdb_id to the copied episode rows of every matched show (idempotent; NEU-1045)
    cmds:
      # `{{.CLI_ARGS}}` carries --limit N for a smoke run before the full pass.
      - {{.EXEC}} python -m tvbf.jobs.episode_map map {{.CLI_ARGS}}

  map:episodes:report:
    desc: 'Report every unmapped episode carrying watch or rating history, as JSON (NEU-1045)'
    # `silent` + `-T` for the same reasons `queue:list` needs them: the report is
    # the process stdout, so go-task's banner and docker's TTY carriage returns
    # would both corrupt it.
    silent: true
    cmds:
      - {{.EXEC_T}} python -m tvbf.jobs.episode_map report

  dedupe:seasons:
    desc: Delete the copied season rows the TMDB ingest superseded (idempotent; NEU-1119)
    cmds:
      # `{{.CLI_ARGS}}` carries --limit N for a smoke run before the full pass.
      - {{.EXEC}} python -m tvbf.jobs.season_dedupe dedupe {{.CLI_ARGS}}

  dedupe:seasons:report:
    desc: 'Count the duplicate seasons and what the pass deliberately keeps, as JSON (NEU-1119)'
    # `silent` + `-T` for the same reasons `map:episodes:report` needs them: the
    # report is the process stdout, so go-task's banner and docker's TTY carriage
    # returns would both corrupt it.
    silent: true
    cmds:
      - {{.EXEC_T}} python -m tvbf.jobs.season_dedupe report

  repoint:episodes:
    desc: Move user history onto the ingested episode rows, then delete the copies (NEU-1126)
    cmds:
      # `{{.CLI_ARGS}}` carries --limit N for a smoke run before the full pass.
      - {{.EXEC}} python -m tvbf.jobs.episode_repoint repoint {{.CLI_ARGS}}

  repoint:episodes:report:
    desc: 'Count what the episode re-point would move and what it keeps, as JSON (NEU-1126)'
    # `silent` + `-T` for the same reasons `dedupe:seasons:report` needs them: the
    # report is the process stdout, so go-task's banner and docker's TTY carriage
    # returns would both corrupt it.
    silent: true
    cmds:
      - {{.EXEC_T}} python -m tvbf.jobs.episode_repoint report

  retire:orphans:
    desc: 'Re-point every TV Maze orphan onto its TMDB counterpart, delete the rest (NEU-1146)'
    cmds:
      # `{{.CLI_ARGS}}` carries --limit N for a smoke run before the full pass.
      # Run `retire:orphans:report` first — this pass deletes user watch records
      # and is not reversible.
      - {{.EXEC}} python -m tvbf.jobs.orphan_retire retire {{.CLI_ARGS}}

  retire:orphans:report:
    desc: 'What the orphan retirement would move and delete, incl. the loss list, as JSON (NEU-1146)'
    # `silent` + `-T` for the same reasons `repoint:episodes:report` needs them:
    # the report is the process stdout, so go-task's banner and docker's TTY
    # carriage returns would both corrupt it.
    silent: true
    cmds:
      - {{.EXEC_T}} python -m tvbf.jobs.orphan_retire report

  backfill:credits:
    desc: 'TMDB credits for every mirrored catalog show that has none — ~8.7h, resumable (NEU-1127)'
    cmds:
      # `{{.CLI_ARGS}}` carries --limit N for a smoke run before the full pass.
      - {{.EXEC}} python -m tvbf.jobs.credits_backfill backfill {{.CLI_ARGS}}

  backfill:credits:report:
    desc: 'What the credit tables hold and how many shows are left to fetch, as JSON (NEU-1127)'
    # `silent` + `-T` for the same reasons `repoint:episodes:report` needs them:
    # the report is the process stdout, so go-task's banner and docker's TTY
    # carriage returns would both corrupt it.
    silent: true
    cmds:
      - {{.EXEC_T}} python -m tvbf.jobs.credits_backfill report

  backfill:recommendations:
    desc: 'TMDB recommendations for every mirrored catalog show that has none, most popular first — ~8.8h, resumable, stoppable (NEU-1052)'
    cmds:
      # `{{.CLI_ARGS}}` carries --limit N, which is both the smoke run and the
      # supported way to ask for a deliberately partial pass — the top 20,000
      # shows take ~45 minutes and cover essentially every page a user loads.
      - {{.EXEC}} python -m tvbf.jobs.recommendations_backfill backfill {{.CLI_ARGS}}

  backfill:recommendations:report:
    desc: 'What catalog.show_recommendation holds and how many shows are left to fetch, as JSON (NEU-1052)'
    # `silent` + `-T` for the same reasons `backfill:credits:report` needs them:
    # the report is the process stdout, so go-task's banner and docker's TTY
    # carriage returns would both corrupt it.
    silent: true
    cmds:
      - {{.EXEC_T}} python -m tvbf.jobs.recommendations_backfill report

  reconcile:capture:
    desc: 'Write a reconciliation snapshot to docs/migration/reconciliation-baseline.json'
    # Two things are deliberate. `silent` — go-task's own banner goes to stdout
    # and would corrupt the artifact; `-T` — docker would otherwise add a TTY's
    # carriage returns. And the write goes via a temp file: a bare
    # `> baseline.json` truncates *before* the command runs, so a capture that
    # failed would leave the cutover's acceptance baseline empty.
    silent: true
    cmds:
      - >
        {{.EXEC_T}} python -m tvbf.jobs.reconcile capture
        {{.CLI_ARGS}} > docs/migration/.reconciliation-baseline.tmp
      - mv docs/migration/.reconciliation-baseline.tmp docs/migration/reconciliation-baseline.json

  reconcile:verify:
    desc: 'Diff the database against docs/migration/reconciliation-baseline.json (exit 1 on any change)'
    cmds:
      # The baseline rides stdin — `docs/` is not mounted into the container.
      - >
        {{.EXEC_T}} python -m tvbf.jobs.reconcile verify --baseline -
        {{.CLI_ARGS}} < docs/migration/reconciliation-baseline.json

  recommend:dry-run:
    desc: "Compile one user's taste payload and print it, calling no provider (task recommend:dry-run -- <user-uuid>)"
    # `silent` + `-T` for the same reasons `reconcile:capture` needs them: the
    # payload is the process stdout, so go-task's banner and docker's TTY
    # carriage returns would both corrupt it. The counts and the token estimate
    # ride stderr, so `task recommend:dry-run -- <uuid> > payload.json` leaves a
    # file holding exactly what the model would be sent.
    silent: true
    cmds:
      - >
        {{.EXEC_T}} python -m tvbf.jobs.weekly_recommendations
        --dry-run --user {{.CLI_ARGS}}

  recommend:weekly:
    desc: 'Run the weekly recommendations pass now (task recommend:weekly [-- --user <uuid>])'
    # The *manual* trigger; in prod this is a Coolify scheduled task running
    # Sundays, on `jobs/scheduled.py`'s contract — the process is the run and
    # the exit code is the result. `--user` narrows it to one account. A second
    # copy running finds `pg_try_advisory_lock` held, logs, and exits 0.
    cmds:
      - >
        {{.EXEC_T}} python -m tvbf.jobs.weekly_recommendations
        {{.CLI_ARGS}}

  recommend:trigger:
    desc: 'POST /admin/recommendations — run the pass now, optionally one user (task recommend:trigger [-- <user-uuid>])'
    # The HTTP trigger (NEU-1110) rather than the CLI one above: same pass, same
    # advisory lock, 202 + a correlation id. There is no status route to poll —
    # the job leaves no run row — so `task logs` is where the run is watched.
    cmds:
      - >
        curl -s -X POST {{.API_URL}}/admin/recommendations
        -H "Authorization: Bearer ${ADMIN_TOKEN:-dev-secret-change-me}"
        -H 'Content-Type: application/json'
        -d '{{if .CLI_ARGS}}{"user_id": "{{.CLI_ARGS}}"}{{else}}{}{{end}}'

  deps:add:
    desc: 'Add a dependency and rebuild the image (task deps:add -- <package>)'
    cmds:
      - echo "Edit pyproject.toml to add {{.CLI_ARGS}}, then run task build."

  changelog:
    desc: 'Update CHANGELOG.md (task changelog -- --tag v2026.05). Runs git-cliff on the host.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - git-cliff {{.CLI_ARGS}} -o CHANGELOG.md

  changelog:preview:
    desc: 'Preview unreleased changelog entries since the last tag (no file write)'
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - git-cliff --unreleased
